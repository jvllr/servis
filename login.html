<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin Login</title>
        <link rel="stylesheet" href="login.css" />
        <link rel="stylesheet" href="layout.css" />
    </head>
    <body>
        
        <nav id="header-container"></nav>
        <main class="login-wrapper">
            <div class="login-card">
                
                <div class="login-icon-wrap">
                    <i data-lucide="lock" aria-hidden="true"></i>
                </div>
                
                <h1 class="login-title">Admin Login</h1>
                <p class="login-subtitle">Sign in to access the EDP admin dashboard</p>
                
                <form class="login-form" id="loginForm" aria-label="Admin login" novalidate>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        
                        <input type="email" id="email" placeholder="admin@example.com" autocomplete="email" />
                    </div>
                    
                    <div class="form-group">
                      <label for="password">Password</label>
                          
                        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
                    </div>
                    
                    <button class="btn-signin" id="signInBtn" type="submit">Sign In</button>
              </form>
              
              <a href="index.html" class="back-link">
                  <i data-lucide="arrow-left" aria-hidden="true"></i>
                  Back to Home
              </a>

            </div>
            
            <p class="login-notice">For authorized EDP staff only. Unauthorized access is prohibited.</p>
        </main>
        
        <footer id="footer-container"></footer>
        
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
        <script src="login.js"></script>
        <script src="layout.js"></script>

    </body>
</html>
